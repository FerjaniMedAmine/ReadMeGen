name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[web,dev]'
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: pytest --cov=readmegen --cov-report=term-missing

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm test && npm audit --audit-level=moderate
        working-directory: frontend
      - run: python -m pip install -e '.[web,dev]'
      - run: python scripts/build_frontend.py
      - run: python -m build
      - run: twine check dist/*
      - run: python scripts/check_distribution.py dist
      - name: Install and verify the release wheel outside the checkout
        run: |
          python -m venv /tmp/readmegen-wheel
          /tmp/readmegen-wheel/bin/pip install dist/*.whl
          /tmp/readmegen-wheel/bin/pip install 'fastapi>=0.115,<1' 'uvicorn>=0.34,<1' 'python-multipart>=0.0.20,<1'
          cd /tmp
          /tmp/readmegen-wheel/bin/readmegen --version
          /tmp/readmegen-wheel/bin/python -c "from readmegen.web.app import STATIC_DIR; assert (STATIC_DIR / 'index.html').is_file()"
          /tmp/readmegen-wheel/bin/python "$GITHUB_WORKSPACE/scripts/smoke_ui.py"

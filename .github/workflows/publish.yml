name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm test && npm audit --audit-level=moderate
        working-directory: frontend
      - run: python -m pip install -e '.[web,dev]'
      - run: ruff check src tests scripts && ruff format --check src tests scripts && pytest
      - run: python scripts/build_frontend.py
      - run: python scripts/check_version.py
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - run: python -m build && twine check dist/* && python scripts/check_distribution.py dist
      - name: Verify the installed release wheel
        run: |
          python -m venv /tmp/readmegen-release
          for release_wheel in dist/*.whl; do
            /tmp/readmegen-release/bin/pip install "${release_wheel}[web]"
          done
          cd /tmp
          /tmp/readmegen-release/bin/pip check
          /tmp/readmegen-release/bin/readmegen --version
          /tmp/readmegen-release/bin/python "$GITHUB_WORKSPACE/scripts/smoke_ui.py"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ github.event_name == 'release' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
  release-assets:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Attach the wheel and source distribution to GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY"
